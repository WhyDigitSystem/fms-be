server.port=6061

#swagger info 
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
web.site.link=https://fms.com/
web.contact.name=FMS

#Logger properties
logging.level.org.springframework=info
logging.level.com.whydigit.wms=DEBUG

logging.file.name=fms_log
logging.file.path=D:/fms
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} : %msg%n
logging.config= classpath:logback-spring.xml

#MYSQL DB Config
spring.datasource.url = jdbc:mysql://localhost:3306/fms_test?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = root
spring.jpa.show-sql = true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

#Mail

spring.mail.host=smtpout.secureserver.net
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.debug=true
spring.mail.default-encoding=UTF-8
spring.mail.protocol=smtps
spring.mail.port=465
#spring.mail.username=Support@whydigit.in
#spring.mail.password=wds@S2026

# Disable default Spring Security user configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Custom property for readability (optional)
app.mail.adminEmail=${spring.mail.username}
app.mail.noreplay=noreply@whydigit.in

#jwt token
app.auth.tokenKey=wmskey
app.auth.tokenSecret=wmscret
app.auth.refreshtokenExpirationMsec=3000000  
app.auth.tokenExpirationMsec=1500000  

cors.allowed-origins=http://localhost:5000,http://localhost:3000,http://139.5.190.244:6061,http://139.5.190.244:6062